name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build arm64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Package universal binary
        run: |
          lipo -create -output diffviewer \
            target/aarch64-apple-darwin/release/diffviewer \
            target/x86_64-apple-darwin/release/diffviewer
          cp scripts/dw dw
          chmod +x diffviewer dw
          tar -czf diffviewer-macos-universal.tar.gz diffviewer dw
          shasum -a 256 diffviewer-macos-universal.tar.gz > diffviewer-macos-universal.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: diffviewer-macos-universal.tar.gz*

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-x11-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          cp target/release/diffviewer diffviewer
          cp scripts/dw dw
          chmod +x diffviewer dw
          tar -czf diffviewer-linux-${{ matrix.arch }}.tar.gz diffviewer dw
          sha256sum diffviewer-linux-${{ matrix.arch }}.tar.gz > diffviewer-linux-${{ matrix.arch }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: diffviewer-linux-${{ matrix.arch }}.tar.gz*

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN not set; skipping tap update"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sha="$(cut -d' ' -f1 assets/diffviewer-macos-universal.tar.gz.sha256)"
          sha_linux_x86="$(cut -d' ' -f1 assets/diffviewer-linux-x86_64.tar.gz.sha256)"
          sha_linux_arm="$(cut -d' ' -f1 assets/diffviewer-linux-aarch64.tar.gz.sha256)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sleipner42/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/diffviewer.rb <<EOF
          class Diffviewer < Formula
            desc "Side-by-side git diff review tool"
            homepage "https://github.com/sleipner42/diffviewer"
            version "${version}"

            on_macos do
              url "https://github.com/sleipner42/diffviewer/releases/download/v${version}/diffviewer-macos-universal.tar.gz"
              sha256 "${sha}"
            end

            on_linux do
              on_intel do
                url "https://github.com/sleipner42/diffviewer/releases/download/v${version}/diffviewer-linux-x86_64.tar.gz"
                sha256 "${sha_linux_x86}"
              end
              on_arm do
                url "https://github.com/sleipner42/diffviewer/releases/download/v${version}/diffviewer-linux-aarch64.tar.gz"
                sha256 "${sha_linux_arm}"
              end
            end

            def install
              bin.install "diffviewer"
              bin.install "dw"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/diffviewer --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Formula/diffviewer.rb
          git commit -m "diffviewer ${version}"
          git push
