[package]
name = "diffviewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
eframe = "0.36.1"
egui = "0.36.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "dump-load", "regex-fancy"] }
toml = "1.1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
